# Stack local: Airflow 3.1.8 (LocalExecutor) + PostgreSQL (metadatos de Airflow) + PostgreSQL (Data Warehouse)
# Uso:  cp .env.example .env  &&  docker compose up -d --build   ->  UI en http://localhost:8080
# Autenticacion de la UI: SimpleAuthManager con todos admin (SOLO desarrollo/evaluacion local).

x-airflow-common: &airflow-common
  build: .
  image: etl-delivery-2-airflow:3.1.8
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_META_DB_USER}:${AIRFLOW_META_DB_PASSWORD}@postgres-airflow/${AIRFLOW_META_DB_NAME}
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    PYTHONPATH: /opt/airflow/src
    DATA_DIR: /opt/airflow/data
    SQL_DIR: /opt/airflow/sql
    RULES_CATALOG: /opt/airflow/gx/rules_catalog.yaml
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./gx:/opt/airflow/gx
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./airflow_logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-deps
    postgres-airflow:
      condition: service_healthy
    postgres-dw:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_META_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_META_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_META_DB_NAME}
    volumes:
      - airflow-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_META_DB_USER}", "-d", "${AIRFLOW_META_DB_NAME}"]
      interval: 5s
      retries: 10
    restart: always

  # Data Warehouse analitico (esquemas dimensional + ops). Los .sql de sql/init se aplican en el primer arranque;
  # la tarea ensure_dw_schema del DAG los reaplica de forma idempotente.
  postgres-dw:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DW_USER}
      POSTGRES_PASSWORD: ${DW_PASSWORD}
      POSTGRES_DB: ${DW_NAME}
    ports:
      - "5433:5432"            # acceso desde el host para el dashboard / psql
    volumes:
      - dw-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DW_USER}", "-d", "${DW_NAME}"]
      interval: 5s
      retries: 10
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/data/{source,raw,prepared,validation,logs}
        exec airflow db migrate
    user: "0:0"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      <<: *airflow-deps
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-deps
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-deps
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  airflow-meta-data:
  dw-data:
